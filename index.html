<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ディズニー快適度アプリ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
        "Yu Gothic", "Meiryo", sans-serif;
      background: linear-gradient(180deg, #eef7ff 0%, #ffffff 45%, #f8fbff 100%);
      color: #222;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
    }

    .header {
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #e8edf4;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1050px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
    }

    .badge {
      background: #eef4ff;
      color: #3366cc;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .container {
      max-width: 1050px;
      margin: auto;
      padding: 35px 20px 60px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
      animation: fadeIn .35s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero {
      text-align: center;
      padding: 45px 10px 30px;
    }

    .hero-icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .hero h1 {
      font-size: clamp(28px, 5vw, 48px);
      margin: 0 0 15px;
      line-height: 1.25;
    }

    .hero p {
      color: #5d6878;
      font-size: 16px;
      line-height: 1.8;
      max-width: 680px;
      margin: auto;
    }

    .main-card {
      background: rgba(255,255,255,.96);
      border: 1px solid #e8edf4;
      border-radius: 24px;
      box-shadow: 0 14px 45px rgba(34, 68, 110, .09);
      padding: 28px;
    }

    .question-number {
      font-size: 13px;
      font-weight: 700;
      color: #5878b7;
      margin-bottom: 8px;
    }

    .progress {
      height: 8px;
      background: #e9eef5;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #5d88ff, #78c8ff);
      border-radius: 999px;
      transition: width .3s ease;
    }

    .question-title {
      font-size: clamp(24px, 4vw, 34px);
      margin: 0 0 10px;
    }

    .question-description {
      color: #6a7481;
      margin-bottom: 24px;
      line-height: 1.7;
    }

    .choices {
      display: grid;
      gap: 12px;
    }

    .choice {
      border: 2px solid #e3e8f0;
      background: white;
      border-radius: 16px;
      padding: 17px 18px;
      cursor: pointer;
      transition: .18s ease;
      text-align: left;
    }

    .choice:hover {
      border-color: #83a8ff;
      transform: translateY(-1px);
    }

    .choice.selected {
      border-color: #4f7ff7;
      background: #f3f7ff;
    }

    .choice-title {
      font-weight: 800;
      margin-bottom: 4px;
    }

    .choice-description {
      color: #707b88;
      font-size: 13px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      border: 2px solid #e2e7ef;
      border-radius: 14px;
      padding: 14px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #6088f7;
    }

    .date-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .date-item {
      position: relative;
    }

    .date-item input {
      display: none;
    }

    .date-label {
      display: block;
      padding: 16px 10px;
      border: 2px solid #e1e7ef;
      border-radius: 15px;
      text-align: center;
      cursor: pointer;
      background: #fff;
      transition: .18s;
    }

    .date-item input:checked + .date-label {
      border-color: #527ef1;
      background: #f1f6ff;
      color: #315fca;
      font-weight: 800;
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #557ff2;
    }

    .range-value {
      min-width: 60px;
      text-align: center;
      font-weight: 800;
      background: #f2f5f9;
      border-radius: 12px;
      padding: 10px;
    }

    .button-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 30px;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      font-weight: 800;
      cursor: pointer;
      transition: .18s ease;
    }

    .btn-primary {
      background: #4d7cf5;
      color: white;
      box-shadow: 0 8px 22px rgba(77,124,245,.22);
    }

    .btn-
